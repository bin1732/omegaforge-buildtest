[package]
name = "omegaforge-studio"
version = "0.1.0"
description = "OmegaForge Studio — distill any agent, forge it stronger, spend less"
authors = ["灵感引擎工坊"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
# tauri 与 tauri-plugin-shell 锁定 minor：tauri CLI 会校验它们与对应 npm
# 包的 minor 是否一致，两侧各自浮动会漂到不同 minor，届时打包直接报
# "Found version mismatched Tauri packages" 并中止，而前端与 Rust 自身都
# 没有任何错误可查。
#
# tauri-build 不在此列：它对外的版本序列与 tauri 并不同步，写成 "2.12"
# 会因 crates.io 上不存在该版本而在解析依赖阶段就失败——报错是
# "failed to select a version"，看不出与版本对齐有关。故保持浮动。
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-shell = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
