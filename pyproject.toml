[build-system]
# 缺这一段时按 PEP 517 回退到旧后端，产物取决于构建环境的 setuptools
# 版本：实测 setuptools 59.6.0 下产出名为 UNKNOWN-0.0.0 的 wheel，仅 5
# 个 dist-info 条目、不含任何模块与入口点，且退出码为 0——构建"成功"
# 而 pip install 之后 omegaforge 命令根本不存在。
# 声明版本下限后，同一环境改为明确报错拒绝构建，不再静默产出空壳。
# 该缺陷只在"装一遍再用"时暴露，源码目录里跑测试永远发现不了。
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "omegaforge"
version = "0.1.0"
description = "Distill any agent into a stronger, cheaper one. Budget-first, arena-verified, zero heavy deps."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "灵感引擎工坊 (bin1732)" }]
keywords = ["agents", "distillation", "llm", "multi-agent", "arena", "token-efficiency"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
omegaforge = "omegaforge.cli:main"

# 顶层同时存在 tests / probes / scripts / frontend 等目录，扁平布局下的
# 自动发现会把它们一并当包收进来，或直接因多包歧义报错。显式限定只收
# omegaforge 及其子包，避免产物混入非发布内容。
[tool.setuptools.packages.find]
include = ["omegaforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
